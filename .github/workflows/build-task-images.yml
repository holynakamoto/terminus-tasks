name: Build and Cache Task Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'tasks/*/environment/Dockerfile'
  pull_request:
    paths:
      - 'tasks/*/environment/Dockerfile'
  workflow_dispatch:

jobs:
  detect-changed-dockerfiles:
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.detect.outputs.tasks }}
      has_tasks: ${{ steps.detect.outputs.has_tasks }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed Dockerfiles
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }}
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git ls-files)
          fi
          
          # Extract tasks with changed Dockerfiles
          TASKS=$(echo "$CHANGED_FILES" | grep 'tasks/.*/environment/Dockerfile' | cut -d'/' -f2 | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
          
          echo "tasks=$TASKS" >> $GITHUB_OUTPUT
          
          if [ "$TASKS" = "[]" ] || [ -z "$TASKS" ]; then
            echo "has_tasks=false" >> $GITHUB_OUTPUT
          else
            echo "has_tasks=true" >> $GITHUB_OUTPUT
            echo "Changed tasks: $TASKS"
          fi

  build-and-push:
    needs: detect-changed-dockerfiles
    if: needs.detect-changed-dockerfiles.outputs.has_tasks == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        task: ${{ fromJson(needs.detect-changed-dockerfiles.outputs.tasks) }}
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/task-${{ matrix.task }}
          tags: |
            type=sha,prefix={{branch}}-
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: tasks/${{ matrix.task }}/environment
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/task-${{ matrix.task }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/task-${{ matrix.task }}:buildcache,mode=max
          platforms: linux/amd64
