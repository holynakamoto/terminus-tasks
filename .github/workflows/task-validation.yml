name: Task Validation

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'tasks/**'
  push:
    branches:
      - 'claude/**'
    paths:
      - 'tasks/**'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test type to run'
        required: true
        type: choice
        options:
          - oracle
          - nop
          - all

jobs:
  detect-changed-tasks:
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.detect.outputs.tasks }}
      has_tasks: ${{ steps.detect.outputs.has_tasks }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed tasks
        id: detect
        run: |
          # Get changed files
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          fi

          # Extract unique task directories
          TASKS=$(echo "$CHANGED_FILES" | grep '^tasks/' | cut -d'/' -f2 | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "tasks=$TASKS" >> $GITHUB_OUTPUT

          if [ "$TASKS" = "[]" ] || [ -z "$TASKS" ]; then
            echo "has_tasks=false" >> $GITHUB_OUTPUT
          else
            echo "has_tasks=true" >> $GITHUB_OUTPUT
          fi

          echo "Changed tasks: $TASKS"

  validate-oracle:
    needs: detect-changed-tasks
    if: needs.detect-changed-tasks.outputs.has_tasks == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task: ${{ fromJson(needs.detect-changed-tasks.outputs.tasks) }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv pip install --system harbor==0.1.25
          uv pip install --system terminal-bench==0.2.18

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: env.DOCKER_USERNAME != '' && env.DOCKER_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
        continue-on-error: true

      - name: Prepare test environment
        run: |
          mkdir -p $HOME/harbor_tasks/${{ matrix.task }}
          cp -r tasks/${{ matrix.task }}/* $HOME/harbor_tasks/${{ matrix.task }}/
          ls -R $HOME/harbor_tasks/${{ matrix.task }}

      - name: Run Oracle test
        id: oracle_test
        run: |
          cd $HOME/harbor_tasks
          TASK=${{ matrix.task }}

          echo "🤖 Testing with oracle agent"
          echo "========================================"

          # Run harbor test directly
          harbor test --agent oracle --trials 1 "$TASK"
        continue-on-error: true

      - name: Check Oracle test result
        run: |
          if [ "${{ steps.oracle_test.outcome }}" = "success" ]; then
            echo "✅ Oracle test passed for ${{ matrix.task }}"
            exit 0
          else
            echo "❌ Oracle test failed for ${{ matrix.task }}"
            exit 1
          fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-${{ matrix.task }}-logs
          path: |
            ${{ runner.temp }}/jobs/**
            $HOME/jobs/**
            $HOME/harbor_tasks/**/*.log
          retention-days: 7
          if-no-files-found: ignore

  validate-nop:
    needs: detect-changed-tasks
    if: needs.detect-changed-tasks.outputs.has_tasks == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task: ${{ fromJson(needs.detect-changed-tasks.outputs.tasks) }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv pip install --system harbor==0.1.25
          uv pip install --system terminal-bench==0.2.18

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare test environment
        run: |
          mkdir -p $HOME/harbor_tasks/${{ matrix.task }}
          cp -r tasks/${{ matrix.task }}/* $HOME/harbor_tasks/${{ matrix.task }}/

      - name: Run NOP test
        id: nop_test
        run: |
          cd $HOME/harbor_tasks
          TASK=${{ matrix.task }}

          echo "🤖 Testing with nop agent"
          echo "========================================"

          # Run harbor test - NOP should fail
          if harbor test --agent nop --trials 1 "$TASK"; then
            echo "❌ NOP agent unexpectedly succeeded"
            exit 1
          else
            echo "✅ NOP agent correctly failed (expected behavior)"
            exit 0
          fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nop-${{ matrix.task }}-logs
          path: |
            ${{ runner.temp }}/jobs/**
            $HOME/jobs/**
            $HOME/harbor_tasks/**/*.log
          retention-days: 7
          if-no-files-found: ignore

  summary:
    needs: [validate-oracle, validate-nop]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## Task Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.validate-oracle.result }}" = "success" ]; then
            echo "✅ Oracle validation passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Oracle validation failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.validate-nop.result }}" = "success" ]; then
            echo "✅ NOP validation passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ NOP validation failed" >> $GITHUB_STEP_SUMMARY
          fi
