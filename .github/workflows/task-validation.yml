name: Task Validation

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'tasks/**'
      - '.github/workflows/task-validation.yml'
  push:
    branches:
      - 'main'  # Only run on main branch pushes (post-merge validation)
    paths:
      - 'tasks/**'
      - '.github/workflows/task-validation.yml'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test type to run'
        required: true
        type: choice
        options:
          - oracle
          - nop
          - all

jobs:
  detect-changed-tasks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tasks: ${{ steps.detect.outputs.tasks }}
      has_tasks: ${{ steps.detect.outputs.has_tasks }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed tasks
        id: detect
        run: |
          # Get changed files based on event type
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # For PRs, compare against the base branch
            git fetch origin ${{ github.base_ref }}
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            # For push events, compare against previous commit
            # Use HEAD~1 if available, otherwise compare against empty tree (initial commit)
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
            else
              CHANGED_FILES=$(git diff --name-only --diff-filter=A HEAD)
            fi
          fi

          # Extract unique task directories from changed files
          TASKS=$(echo "$CHANGED_FILES" | { grep '^tasks/' || true; } | cut -d'/' -f2 | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')

          # If only the workflow changed, default to testing cracked256 to verify CI logic
          if ([ "$TASKS" = "[]" ] || [ -z "$TASKS" ]) && echo "$CHANGED_FILES" | grep -q 'task-validation.yml'; then
            echo "Workflow changed, defaulting to cracked256 for validation"
            TASKS='["cracked256"]'
          fi

          echo "tasks=$TASKS" >> $GITHUB_OUTPUT

          if [ "$TASKS" = "[]" ] || [ -z "$TASKS" ]; then
            echo "has_tasks=false" >> $GITHUB_OUTPUT
            echo "No task changes detected"
          else
            echo "has_tasks=true" >> $GITHUB_OUTPUT
            echo "Changed tasks: $TASKS"
          fi

  static-checks:
    needs: detect-changed-tasks
    if: needs.detect-changed-tasks.outputs.has_tasks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        task: ${{ fromJson(needs.detect-changed-tasks.outputs.tasks) }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv and dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          # Use full path for the first installation since GITHUB_PATH applies to subsequent steps
          $HOME/.local/bin/uv pip install --system harbor==0.1.25 ruff

      - name: Check Portkey Secret
        env:
          PORTKEY_API_KEY: ${{ secrets.PORTKEY_API_KEY }}
        run: |
          if [ -z "$PORTKEY_API_KEY" ]; then
            echo "❌ ERROR: PORTKEY_API_KEY secret is not set in GitHub Secrets!"
            echo "Please add it in Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "✅ PORTKEY_API_KEY secret is configured"

      - name: Run Ruff Lint
        run: |
          ruff check tasks/${{ matrix.task }}

      - name: Run LLMaJ Check (GPT-5)
        continue-on-error: true
        run: |
          export OPENAI_API_KEY="${{ secrets.PORTKEY_API_KEY }}"
          export OPENAI_BASE_URL="https://api.portkey.ai/v1"
          export LITELLM_LOG_LEVEL=ERROR

          # Create task folder for harbor check
          mkdir -p $HOME/harbor_tasks/${{ matrix.task }}
          cp -r tasks/${{ matrix.task }}/* $HOME/harbor_tasks/${{ matrix.task }}/

          # Run LLMaJ check and capture output
          echo "Running LLMaJ check..."
          harbor tasks check -m openai/@openai-tbench/gpt-5 --output-path $HOME/${{ matrix.task }}_llmaj.json $HOME/harbor_tasks/${{ matrix.task }} 2>&1 | tee $HOME/${{ matrix.task }}_llmaj_output.log

          # Check if output file was created
          if [ -f "$HOME/${{ matrix.task }}_llmaj.json" ]; then
            echo "✅ LLMaJ output file created successfully"
          else
            echo "❌ LLMaJ output file NOT created"
            echo "Command output saved to: $HOME/${{ matrix.task }}_llmaj_output.log"
          fi

      - name: Parse and Display LLMaJ Results
        if: always()
        run: |
          echo "## 📋 LLMaJ Check Results: ${{ matrix.task }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          LLMAJ_FILE="$HOME/${{ matrix.task }}_llmaj.json"
          if [ -f "$LLMAJ_FILE" ]; then
            # Display results in logs for transparency
            echo "--- LLMaJ Results for ${{ matrix.task }} ---"
            cat "$LLMAJ_FILE"
            echo "----------------------------------------"
            
            # Parse and display results in summary
            python3 .github/scripts/parse-llmaj-results.py "$LLMAJ_FILE" "${{ matrix.task }}" | tee -a $GITHUB_STEP_SUMMARY || {
              echo "⚠️ Parser failed, showing raw JSON:" >> $GITHUB_STEP_SUMMARY
              echo '```json' >> $GITHUB_STEP_SUMMARY
              cat "$LLMAJ_FILE" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            }
          else
            # Check if failure was due to API usage limits
            if [ -f "$HOME/${{ matrix.task }}_llmaj_output.log" ] && grep -q "Usage Limit.*Exceeded" "$HOME/${{ matrix.task }}_llmaj_output.log"; then
              echo "⚠️ **API Usage Limits Reached**" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "The LLMaJ check could not complete due to Portkey API usage limits being exceeded." >> $GITHUB_STEP_SUMMARY
              echo "This is a temporary operational issue and does not indicate a problem with the task." >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ **LLMaJ check failed to produce output file**" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY

              # Show command output directly (no collapsible section)
              if [ -f "$HOME/${{ matrix.task }}_llmaj_output.log" ]; then
                echo "**Harbor tasks check output:**" >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY
                cat "$HOME/${{ matrix.task }}_llmaj_output.log" >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
              else
                echo "⚠️ Log file not found: \$HOME/${{ matrix.task }}_llmaj_output.log" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Upload LLMaJ results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llmaj-${{ matrix.task }}-results
          path: |
            $HOME/${{ matrix.task }}_llmaj.json
            $HOME/${{ matrix.task }}_llmaj_output.log
          if-no-files-found: ignore

  validate-oracle:
    needs: [detect-changed-tasks, static-checks]
    if: needs.detect-changed-tasks.outputs.has_tasks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read  # Required to pull from GHCR
    strategy:
      matrix:
        task: ${{ fromJson(needs.detect-changed-tasks.outputs.tasks) }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install test dependencies
        run: |
          pip install pytest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.task }}-${{ hashFiles(format('tasks/{0}/environment/Dockerfile', matrix.task)) }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.task }}-
            ${{ runner.os }}-buildx-

      - name: Prepare test environment
        run: |
          mkdir -p $HOME/harbor_tasks/${{ matrix.task }}
          cp -r tasks/${{ matrix.task }}/* $HOME/harbor_tasks/${{ matrix.task }}/
          ls -R $HOME/harbor_tasks/${{ matrix.task }}

      - name: Run Oracle test
        id: oracle_test
        env:
          USE_PREBUILT_IMAGES: "true"
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          bash .github/scripts/test-with-oracle.sh ${{ matrix.task }}
        continue-on-error: true

      - name: Check Oracle test result
        run: |
          if [ "${{ steps.oracle_test.outcome }}" = "success" ]; then
            echo "✅ Oracle test passed for ${{ matrix.task }}"
            exit 0
          else
            echo "❌ Oracle test failed for ${{ matrix.task }}"
            exit 1
          fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-${{ matrix.task }}-logs
          path: |
            ${{ runner.temp }}/jobs/**
            $HOME/jobs/**
            $HOME/harbor_tasks/**/*.log
          retention-days: 7
          if-no-files-found: ignore

  validate-nop:
    needs: [detect-changed-tasks, static-checks]
    if: needs.detect-changed-tasks.outputs.has_tasks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read  # Required to pull from GHCR
    strategy:
      matrix:
        task: ${{ fromJson(needs.detect-changed-tasks.outputs.tasks) }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install test dependencies
        run: |
          pip install pytest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.task }}-${{ hashFiles(format('tasks/{0}/environment/Dockerfile', matrix.task)) }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.task }}-
            ${{ runner.os }}-buildx-

      - name: Prepare test environment
        run: |
          mkdir -p $HOME/harbor_tasks/${{ matrix.task }}
          cp -r tasks/${{ matrix.task }}/* $HOME/harbor_tasks/${{ matrix.task }}/

      - name: Run NOP test
        id: nop_test
        env:
          USE_PREBUILT_IMAGES: "true"
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          bash .github/scripts/test-with-nop.sh ${{ matrix.task }}

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nop-${{ matrix.task }}-logs
          path: |
            ${{ runner.temp }}/jobs/**
            $HOME/jobs/**
            $HOME/harbor_tasks/**/*.log
          retention-days: 7
          if-no-files-found: ignore

  validate-difficulty-gpt:
    needs: [detect-changed-tasks, validate-oracle, validate-nop]
    # Only run difficulty evals on main branch or when explicitly requested
    if: >
      needs.detect-changed-tasks.outputs.has_tasks == 'true'
      && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 40  # Increased for stability
    strategy:
      matrix:
        task: ${{ fromJson(needs.detect-changed-tasks.outputs.tasks) }}
        run_number: [1, 2, 3, 4, 5]  # Run 5 parallel evaluations
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-harbor-0.1.25-terminal-bench-0.2.18
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install uv and harbor
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          $HOME/.local/bin/uv pip install --system harbor==0.1.25 terminal-bench==0.2.18

      - name: Check Portkey Secret
        env:
          PORTKEY_API_KEY: ${{ secrets.PORTKEY_API_KEY }}
        run: |
          if [ -z "$PORTKEY_API_KEY" ]; then
            echo "❌ ERROR: PORTKEY_API_KEY secret is not set in GitHub Secrets!"
            exit 1
          fi
          echo "✅ PORTKEY_API_KEY secret is configured"

      - name: Prepare task for harbor
        run: |
          mkdir -p $HOME/harbor_tasks/${{ matrix.task }}
          cp -r tasks/${{ matrix.task }}/* $HOME/harbor_tasks/${{ matrix.task }}/

      - name: Run GPT-5 Difficulty Eval (Run ${{ matrix.run_number }}/5)
        run: |
          set -euo pipefail
          export OPENAI_API_KEY="${{ secrets.PORTKEY_API_KEY }}"
          export OPENAI_BASE_URL="https://api.portkey.ai/v1"
          export LITELLM_LOG_LEVEL=ERROR

          echo "Running GPT-5 evaluation ${{ matrix.run_number }}/5..."
          harbor run -a terminus-2 -m openai/@openai-tbench/gpt-5 -p $HOME/harbor_tasks/${{ matrix.task }}

      - name: Upload GPT-5 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: difficulty-gpt-${{ matrix.task }}-run${{ matrix.run_number }}-results
          path: |
            $HOME/jobs/**
            $HOME/harbor_tasks/**/*.log
          retention-days: 7
          if-no-files-found: ignore

  validate-difficulty-claude:
    needs: [detect-changed-tasks, validate-oracle, validate-nop]
    # Only run difficulty evals on main branch or when explicitly requested
    if: >
      needs.detect-changed-tasks.outputs.has_tasks == 'true'
      && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 40  # Increased from 30 to handle long reasoning/latency
    strategy:
      matrix:
        task: ${{ fromJson(needs.detect-changed-tasks.outputs.tasks) }}
        run_number: [1, 2, 3, 4, 5]  # Run 5 parallel evaluations
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-harbor-0.1.25-terminal-bench-0.2.18
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install uv and harbor
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          $HOME/.local/bin/uv pip install --system harbor==0.1.25 terminal-bench==0.2.18

      - name: Check Portkey Secret
        env:
          PORTKEY_API_KEY: ${{ secrets.PORTKEY_API_KEY }}
        run: |
          if [ -z "$PORTKEY_API_KEY" ]; then
            echo "❌ ERROR: PORTKEY_API_KEY secret is not set in GitHub Secrets!"
            exit 1
          fi
          echo "✅ PORTKEY_API_KEY secret is configured"

      - name: Prepare task for harbor
        run: |
          mkdir -p $HOME/harbor_tasks/${{ matrix.task }}
          cp -r tasks/${{ matrix.task }}/* $HOME/harbor_tasks/${{ matrix.task }}/

      - name: Run Claude Sonnet 4.5 Difficulty Eval (Run ${{ matrix.run_number }}/5)
        run: |
          set -euo pipefail
          export OPENAI_API_KEY="${{ secrets.PORTKEY_API_KEY }}"
          export OPENAI_BASE_URL="https://api.portkey.ai/v1"
          export LITELLM_LOG_LEVEL=ERROR

          echo "Running Claude evaluation ${{ matrix.run_number }}/5..."
          harbor run -a terminus-2 -m openai/@anthropic-tbench/claude-sonnet-4-5-20250929 -p $HOME/harbor_tasks/${{ matrix.task }}

      - name: Upload Claude results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: difficulty-claude-${{ matrix.task }}-run${{ matrix.run_number }}-results
          path: |
            $HOME/jobs/**
            $HOME/harbor_tasks/**/*.log
          retention-days: 7
          if-no-files-found: ignore

  validate-difficulty-summary:
    needs: [detect-changed-tasks, validate-difficulty-gpt, validate-difficulty-claude]
    if: >
      always() && 
      needs.detect-changed-tasks.outputs.has_tasks == 'true'
      && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        task: ${{ fromJson(needs.detect-changed-tasks.outputs.tasks) }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download all GPT-5 results
        uses: actions/download-artifact@v4
        with:
          pattern: difficulty-gpt-${{ matrix.task }}-run*-results
          path: $HOME/gpt-results
          merge-multiple: true
        continue-on-error: true

      - name: Download all Claude results
        uses: actions/download-artifact@v4
        with:
          pattern: difficulty-claude-${{ matrix.task }}-run*-results
          path: $HOME/claude-results
          merge-multiple: true
        continue-on-error: true

      - name: Calculate and Display Difficulty Rating
        if: always()
        run: |
          echo "Calculating difficulty rating for ${{ matrix.task }}..."
          echo "## 📊 Difficulty Evaluation: ${{ matrix.task }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check if directories exist
          if [ ! -d "$HOME/gpt-results" ] && [ ! -d "$HOME/claude-results" ]; then
            echo "⚠️ No results found. Difficulty calculation skipped." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # Run the difficulty calculation script
          python3 .github/scripts/calculate-difficulty.py "${{ matrix.task }}" \
            --gpt-dir "$HOME/gpt-results" \
            --claude-dir "$HOME/claude-results" >> $GITHUB_STEP_SUMMARY 2>&1 || {
              echo "⚠️ Failed to calculate difficulty rating" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "GPT results directory: $HOME/gpt-results" >> $GITHUB_STEP_SUMMARY
              echo "Claude results directory: $HOME/claude-results" >> $GITHUB_STEP_SUMMARY
            }

          # If any runs failed with 0 episodes, show a sample log for debugging
          # (Finding recursively in both directories)
          ZERO_EPISODE_COUNT=$(find $HOME/gpt-results $HOME/claude-results -name "result.json" -exec grep -l '"episodes": 0' {} \; 2>/dev/null | wc -l)
          if [ "$ZERO_EPISODE_COUNT" -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "---" >> $GITHUB_STEP_SUMMARY
            echo "### 🐛 Debugging: Zero Episode Runs Found" >> $GITHUB_STEP_SUMMARY
            echo "Found $ZERO_EPISODE_COUNT runs where agents failed to start." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Find a sample result.json with 0 episodes
            SAMPLE_RESULT=$(find $HOME/gpt-results $HOME/claude-results -name "result.json" -exec grep -l '"episodes": 0' {} \; 2>/dev/null | head -1)
            if [ -n "$SAMPLE_RESULT" ]; then
              echo "**Sample Failed Run Details:**" >> $GITHUB_STEP_SUMMARY
              echo '```json' >> $GITHUB_STEP_SUMMARY
              cat "$SAMPLE_RESULT" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # Also save to file for final summary consolidation
          python3 .github/scripts/calculate-difficulty.py "${{ matrix.task }}" \
            --gpt-dir "$HOME/gpt-results" \
            --claude-dir "$HOME/claude-results" > $HOME/${{ matrix.task }}_difficulty.md 2>&1 || true

      - name: Upload combined difficulty results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: difficulty-${{ matrix.task }}-results
          path: |
            $HOME/gpt-results/**
            $HOME/claude-results/**
            $HOME/${{ matrix.task }}_difficulty.md
          retention-days: 7
          if-no-files-found: ignore

  summary:
    needs: [detect-changed-tasks, static-checks, validate-oracle, validate-nop, validate-difficulty-summary]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        task: ${{ fromJson(needs.detect-changed-tasks.outputs.tasks) }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Final Summary for ${{ matrix.task }}
        run: |
          echo "## 🚀 Final Summary: ${{ matrix.task }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          
          # Static Checks
          if [ "${{ needs.static-checks.result }}" = "success" ]; then
            echo "| Static Checks (Ruff & LLMaJ) | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Static Checks (Ruff & LLMaJ) | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Oracle
          if [ "${{ needs.validate-oracle.result }}" = "success" ]; then
            echo "| Oracle Validation | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Oracle Validation | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # NOP
          if [ "${{ needs.validate-nop.result }}" = "success" ]; then
            echo "| NOP Validation | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| NOP Validation | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Difficulty
          if [ "${{ needs.validate-difficulty-summary.result }}" = "success" ]; then
            echo "| Difficulty Evaluation | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.validate-difficulty-summary.result }}" = "skipped" ]; then
            echo "| Difficulty Evaluation | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Difficulty Evaluation | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Detailed results for each check can be found in the sections above." >> $GITHUB_STEP_SUMMARY

      - name: Download LLMaJ results
        uses: actions/download-artifact@v4
        with:
          name: llmaj-${{ matrix.task }}-results
          path: $HOME/llmaj
        continue-on-error: true

      - name: Download Difficulty MD
        uses: actions/download-artifact@v4
        with:
          name: difficulty-${{ matrix.task }}-results
          path: $HOME/difficulty
        continue-on-error: true

      - name: Append Detailed Results to Summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Find and append LLMaJ Results
          if [ -d "$HOME/llmaj" ]; then
            LLMAJ_PATH=$(find $HOME/llmaj -name "${{ matrix.task }}_llmaj.json" 2>/dev/null | head -1)
            if [ -n "$LLMAJ_PATH" ] && [ -f "$LLMAJ_PATH" ]; then
              echo "### 📋 LLMaJ Check Details" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              python3 .github/scripts/parse-llmaj-results.py "$LLMAJ_PATH" "${{ matrix.task }}" >> $GITHUB_STEP_SUMMARY 2>&1
            else
              echo "### 📋 LLMaJ Check Details" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "⚠️ LLMaJ results file not found in artifact" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "### 📋 LLMaJ Check Details" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "${{ needs.static-checks.result }}" = "skipped" ]; then
              echo "⏭️ Static checks were skipped" >> $GITHUB_STEP_SUMMARY
            elif [ "${{ needs.static-checks.result }}" = "failure" ]; then
              echo "❌ Static checks failed - see job logs for details" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ LLMaJ artifact not available" >> $GITHUB_STEP_SUMMARY
            fi
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Find and append Difficulty Results
          if [ -d "$HOME/difficulty" ]; then
            DIFF_PATH=$(find $HOME/difficulty -name "${{ matrix.task }}_difficulty.md" 2>/dev/null | head -1)
            if [ -n "$DIFF_PATH" ] && [ -f "$DIFF_PATH" ]; then
              cat "$DIFF_PATH" >> $GITHUB_STEP_SUMMARY
            else
              echo "### 📊 Difficulty Evaluation" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "⚠️ Difficulty results file not found in artifact" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "### 📊 Difficulty Evaluation" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "${{ needs.validate-difficulty-summary.result }}" = "skipped" ]; then
              echo "⏭️ **Difficulty evaluation skipped** (only runs on main branch)" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "To run difficulty evaluation on this PR, manually trigger the workflow with \`workflow_dispatch\`." >> $GITHUB_STEP_SUMMARY
            elif [ "${{ needs.validate-difficulty-summary.result }}" = "failure" ]; then
              echo "❌ Difficulty evaluation failed - see job logs for details" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ Difficulty artifact not available" >> $GITHUB_STEP_SUMMARY
            fi
          fi
