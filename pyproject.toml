[tool.poetry]
name = "harbor-langgraph"
version = "0.1.0"
description = "Harbor LangGraph Integration for AI Agent Evaluation"
authors = ["Nick Moore <nick@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
langgraph = "^1.0.0"
langchain = "^1.0.0"
langchain-anthropic = "^0.3.0"
langchain-core = "^1.2.6"
sqlalchemy = "^2.0.0"
aiosqlite = "^0.20.0"
python-dotenv = "^1.0.0"
toml = "^0.10.2"
pydantic = "^2.0.0"
docker = "^7.0.0"
click = "^8.1.0"
rich = "^13.0.0"
tabulate = "^0.9.0"
jsonschema = "^4.0.0"
graphviz = "^0.20.0"
pytest = "^7.0.0"
pytest-asyncio = "^0.21.0"
aiohttp = "^3.9.0"
httpx = "^0.27.0"
psutil = "^5.9.0"
structlog = "^24.0.0"
langchain-openai = "^1.1.7"

[tool.poetry.group.dev.dependencies]
black = "^24.0.0"
mypy = "^1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
